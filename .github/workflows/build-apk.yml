name: Build Mono Dash APK

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target platform(s) for the APK'
        required: false
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64
          - android-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # In-app purchases have been removed from this build, so there is no
      # RevenueCat / purchase gate to configure. The APK is signed with the
      # auto-generated debug key kept in this fork's Actions secrets
      # (ANDROID_DEBUG_KEYSTORE_BASE64, ANDROID_DEBUG_KEYSTORE_PASSWORD).
      # If the secrets are missing, a fresh debug keystore is generated and
      # written back so every build keeps the same signature.
      - name: Restore or create debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu

          mkdir -p android/keystore

          KEYSTORE=android/keystore/mono-dash-debug.jks
          KEY_PROPERTIES=android/key.properties

          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ] && [ -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Debug keystore restored from Actions secrets."
          else
            echo "Debug keystore secrets not set; generating a fresh debug keystore."
            ANDROID_DEBUG_KEYSTORE_PASSWORD=android
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
              -alias monodash \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mono Dash Debug, OU=Debug, O=Mono Dash, L=Local, ST=Local, C=CN"
          fi

          printf '%s\n' \
            "storeFile=../keystore/mono-dash-debug.jks" \
            "storePassword=$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
            "keyAlias=monodash" \
            "keyPassword=$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
            > "$KEY_PROPERTIES"

          test -s "$KEYSTORE"
          test -s "$KEY_PROPERTIES"

          # Persist a freshly generated keystore so future builds keep the
          # same signature (secrets are write-only via the API).
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            base64 -w0 "$KEYSTORE" > /tmp/keystore.b64
            KEYSTORE_B64=$(cat /tmp/keystore.b64)
            # gh CLI is preinstalled on GitHub runners.
            echo "$ANDROID_DEBUG_KEYSTORE_PASSWORD" | gh secret set ANDROID_DEBUG_KEYSTORE_PASSWORD --repo "$GH_REPO" --body "$ANDROID_DEBUG_KEYSTORE_PASSWORD"
            gh secret set ANDROID_DEBUG_KEYSTORE_BASE64 --repo "$GH_REPO" --body "$KEYSTORE_B64"
            echo "Fresh debug keystore saved to Actions secrets ANDROID_DEBUG_KEYSTORE_BASE64."
          fi

      - name: Build APK
        run: flutter build apk --release --target-platform ${{ github.event.inputs.target_platform || 'android-arm64' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mono-dash-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
